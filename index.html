<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudyFlow 3D — Lịch Ôn Thi (16/11 – 13/12/2026)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="app-shell">
    <!-- Clean Top Navbar -->
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">3D</div>
        <div>
          <h1>StudyFlow 3D · 16/11 – 13/12</h1>
          <div id="save-status" class="brand-sub">Tự động lưu tiến độ</div>
        </div>
      </div>

      <div class="topbar-metrics">
        <div class="metric-chip">
          <div>
            <div class="metric-chip-label">Tiến độ buổi học</div>
            <div id="m-sessions" class="metric-chip-val tabular">0/84 buổi (0%)</div>
          </div>
          <div class="mini-progress"><div id="m-sessions-bar" class="mini-progress-fill" style="width:0%"></div></div>
        </div>

        <div class="metric-chip">
          <div>
            <div class="metric-chip-label">Tổng giờ học</div>
            <div id="m-hours" class="metric-chip-val tabular">0h00 / 167h00 (0%)</div>
          </div>
          <div class="mini-progress"><div id="m-hours-bar" class="mini-progress-fill" style="width:0%"></div></div>
        </div>

        <div class="metric-chip">
          <div>
            <div class="metric-chip-label">Mốc thi gần nhất</div>
            <div id="m-exam" class="metric-chip-val tabular">—</div>
          </div>
        </div>
      </div>

      <div class="topbar-actions">
        <div class="timer-pill">
          <select id="timer-preset" class="select" style="height:24px; padding:0 6px; border:none; background:transparent">
            <option value="50">50p</option>
            <option value="25">25p</option>
            <option value="90">90p</option>
          </select>
          <span id="timer-display" class="timer-readout tabular">50:00</span>
          <button id="timer-toggle" class="btn btn-sm btn-primary">Bắt đầu</button>
          <button id="timer-reset" class="btn btn-sm btn-ghost" title="Reset đồng hồ">↺</button>
        </div>

        <button id="btn-today" class="btn btn-primary">Hôm nay</button>
        <button id="btn-toggle-3d" class="btn">Ẩn 3D</button>
        <button id="btn-export" class="btn">Xuất</button>
        <label class="btn" style="cursor:pointer">Nhập<input id="input-import" type="file" accept=".json,application/json" hidden /></label>
        <button id="btn-reset" class="btn btn-ghost">Đặt lại</button>
      </div>
    </header>

    <!-- Clean Split Workspace -->
    <main id="workspace" class="workspace">
      <!-- Left: Bento Subject Summary + Clean Daily Schedule -->
      <section class="planner-pane">
        <div id="subjects-strip" class="subjects-strip"></div>

        <div class="schedule-panel">
          <div class="schedule-toolbar">
            <div id="week-tabs" class="tabs"></div>
            <div class="filter-group">
              <select id="filter-status" class="select" style="height:28px; font-size:12px">
                <option value="all">Tất cả</option>
                <option value="pending">Chưa xong</option>
                <option value="done">Đã xong</option>
              </select>
              <input id="filter-search" class="input" style="height:28px; width:170px; font-size:12px" type="search" placeholder="Tìm bài, môn..." />
            </div>
          </div>
          <div id="schedule-scroll" class="schedule-scroll"></div>
        </div>
      </section>

      <!-- Right: Dedicated Calm Studio 3D Stage -->
      <section id="stage-pane" class="stage-pane">
        <canvas id="scene-canvas"></canvas>

        <div class="stage-header">
          <div class="segmented">
            <button id="mode-matrix" class="seg-btn active">Ma trận 28 ngày</button>
            <button id="mode-towers" class="seg-btn">8 Môn thi</button>
          </div>
          <div style="display:flex; gap:6px">
            <button id="btn-reset-cam" class="btn btn-sm">Góc chuẩn</button>
            <button id="btn-expand-3d" class="btn btn-sm">Phóng to 3D</button>
          </div>
        </div>

        <div class="stage-footer">
          <div class="stage-hint">Kéo để xoay · Cuộn để zoom · Click vào khối 3D để chọn buổi</div>
        </div>
      </section>
    </main>
  </div>

  <!-- 3D Hover Tooltip -->
  <div id="tooltip-3d" class="tooltip-3d hidden"></div>

  <!-- Edit Modal -->
  <div id="edit-modal" class="modal-backdrop hidden">
    <div class="modal-card">
      <div style="display:flex; justify-content:space-between; align-items:center">
        <h3 style="font-size:15px; font-weight:700">Chỉnh sửa buổi học</h3>
        <button id="modal-close" class="btn btn-sm btn-ghost">Đóng</button>
      </div>
      <div id="modal-meta" style="font-size:12px; color:#a1a1aa"></div>
      <div class="field">
        <label>Môn học</label>
        <select id="modal-subj" class="select"></select>
      </div>
      <div class="field">
        <label>Nhiệm vụ / Nội dung</label>
        <textarea id="modal-task" rows="3" class="input"></textarea>
      </div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px">
        <div class="field">
          <label>Thời lượng (phút)</label>
          <input id="modal-mins" type="number" min="15" max="300" step="5" class="input tabular" />
        </div>
        <div class="field">
          <label>Trạng thái</label>
          <select id="modal-status" class="select">
            <option value="todo">Chưa học</option>
            <option value="doing">Đang học</option>
            <option value="done">Hoàn thành</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>Ghi chú tiến độ</label>
        <input id="modal-note" type="text" class="input" placeholder="VD: Cần ôn lại công thức kiểm định F..." />
      </div>
      <div style="display:flex; justify-content:flex-end; gap:8px">
        <button id="modal-save" class="btn btn-primary">Lưu thay đổi</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
